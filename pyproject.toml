[project]
name = "real-estate-price-predictor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "catboost>=1.2.10",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "pandas-stubs~=3.0.5",
    "pydantic>=2.13.5",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
]

[project.scripts]
real-estate-price-predictor = "real_estate_price_predictor:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"
